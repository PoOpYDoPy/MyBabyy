<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For Tanmay ♡</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,210,218,.55), transparent 30%),
      radial-gradient(circle at 80% 85%, rgba(255,188,154,.42), transparent 32%),
      linear-gradient(135deg,#fff5ef,#f9e1dc 45%,#fff7f1);
    color:#4c3030;
    overflow-x:hidden;
  }
  .petals { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .petal { position:absolute; width:13px; height:19px; background:#e7a0a5; border-radius:80% 20% 80% 20%; opacity:.5; animation:fall linear infinite; }
  .petal:nth-child(1){left:8%;animation-duration:10s;animation-delay:-2s}
  .petal:nth-child(2){left:27%;animation-duration:13s;animation-delay:-7s;transform:scale(.7)}
  .petal:nth-child(3){left:51%;animation-duration:11s;animation-delay:-5s;transform:scale(.85)}
  .petal:nth-child(4){left:73%;animation-duration:15s;animation-delay:-10s;transform:scale(.65)}
  .petal:nth-child(5){left:91%;animation-duration:12s;animation-delay:-4s}
  @keyframes fall {
    0%{top:-10%;transform:rotate(0) translateX(0)}
    100%{top:110%;transform:rotate(420deg) translateX(90px)}
  }
  .wrap { min-height:100vh; display:grid; place-items:center; padding:28px 16px; position:relative; z-index:1; }
  .intro { text-align:center; transition:.6s ease; }
  .eyebrow { letter-spacing:.22em; text-transform:uppercase; font-size:11px; color:#9d6468; }
  h1 { margin:10px 0 4px; font-size:clamp(34px,9vw,64px); font-weight:500; color:#673b3e; }
  .sub { margin:0 auto 28px; max-width:500px; font-size:15px; color:#80575a; line-height:1.6; }
  .card-button {
    border:0; background:transparent; cursor:pointer; padding:0; perspective:1200px;
    -webkit-tap-highlight-color:transparent;
  }
  .card {
    width:min(86vw,380px); aspect-ratio:1.48/1; position:relative;
    transform-style:preserve-3d; transition:transform .8s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 22px 30px rgba(104,55,55,.20));
  }
  .card-button:hover .card { transform:translateY(-9px) rotateX(3deg) rotateY(-4deg) scale(1.015); }
  .card-front {
    position:absolute; inset:0; border-radius:22px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 45%, rgba(255,255,255,.48), transparent 28%),
      radial-gradient(circle at 12% 10%, rgba(255,224,225,.7), transparent 25%),
      radial-gradient(circle at 90% 92%, rgba(255,203,184,.65), transparent 28%),
      linear-gradient(145deg,#7f464e 0%,#a95f68 48%,#d98d88 100%);
    border:1px solid rgba(255,255,255,.72);
    color:white;
    box-shadow:inset 0 0 35px rgba(255,255,255,.12);
  }
  .card-front:before {
    content:""; position:absolute; inset:10px; border:1px solid rgba(255,255,255,.7);
    border-radius:16px; pointer-events:none;
  }
  .card-front:after {
    content:""; position:absolute; width:170px; height:170px; border-radius:50%;
    background:rgba(255,255,255,.07); top:-85px; right:-55px;
    box-shadow:-260px 250px 0 35px rgba(255,255,255,.035);
  }
  .floral {
    position:absolute; inset:0; pointer-events:none; font-size:25px;
    text-shadow:0 3px 10px rgba(80,25,35,.18);
  }
  .floral span { position:absolute; opacity:.92; }
  .floral .f1 { top:17px; left:22px; transform:rotate(-18deg); }
  .floral .f2 { top:27px; right:23px; transform:rotate(18deg); }
  .floral .f3 { bottom:17px; left:25px; transform:rotate(15deg); }
  .floral .f4 { bottom:19px; right:24px; transform:rotate(-12deg); }
  .seal {
    width:62px; height:62px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 35% 30%,#f7c4bf,#a94f5d 72%);
    border:2px solid rgba(255,255,255,.75);
    box-shadow:0 7px 18px rgba(70,20,30,.22);
    font-size:31px; z-index:2; margin-bottom:10px;
  }
  .card-title { font-size:29px; font-style:italic; z-index:2; text-shadow:0 2px 10px rgba(70,20,25,.2); }
  .card-subtitle { font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.9; margin-top:6px; z-index:2; }
  .tap-pill {
    margin-top:17px; padding:9px 17px; border-radius:999px;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.58);
    backdrop-filter:blur(8px); font:600 10px/1 Arial,sans-serif;
    letter-spacing:.17em; text-transform:uppercase; z-index:2;
    box-shadow:0 5px 15px rgba(70,20,25,.12);
  }
  .hint { margin-top:22px; font-size:12px; color:#a06c70; }
  .letter-stage {
    display:none; width:100%; max-width:850px; margin:auto; animation:open .75s ease both;
  }
  @keyframes open { from{opacity:0;transform:translateY(30px) scale(.96)} to{opacity:1;transform:none} }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .back {
    border:1px solid rgba(120,70,70,.2); background:rgba(255,255,255,.7);
    color:#704448; padding:9px 14px; border-radius:999px; cursor:pointer;
    font:600 12px Arial,sans-serif; backdrop-filter:blur(8px);
  }
  .tiny { font-size:12px; color:#95696b; }
  .letter-frame {
    padding:10px; background:rgba(255,255,255,.55); border-radius:18px;
    box-shadow:0 20px 50px rgba(90,45,45,.18); backdrop-filter:blur(6px);
  }
  .letter-frame img { display:block; width:100%; height:auto; border-radius:11px; }
  .closing { text-align:center; margin:18px 0 4px; color:#7d5155; font-style:italic; font-size:14px; }
  .show .intro { display:none; }
  .show .letter-stage { display:block; }
  @media (max-width:520px) {
    .wrap { padding:20px 11px; }
    .letter-frame { padding:6px; border-radius:14px; }
    .toolbar { padding:0 3px; }
  }
</style>
